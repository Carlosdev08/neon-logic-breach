name: Validate NEON BREACH

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, refactor/solid-architecture, visual-preview, fix/victory-overlay-mobile, feature/progressive-hints-balance, feature/professional-home-ranks-story, fix/refresh-persistence-clean-main, feat/player-profile-dashboard]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --no-save
      - name: Run tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: Lint
        run: bun run lint
      - name: Verify formatting
        run: bunx prettier --check src/components/game/OnlineHub.tsx
