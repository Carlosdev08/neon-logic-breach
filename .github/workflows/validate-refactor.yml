name: Validate NEON BREACH

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, refactor/solid-architecture]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --no-save
      - name: Run tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: Lint
        run: bun run lint
