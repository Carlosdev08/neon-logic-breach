name: Validate NEON BREACH

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - refactor/solid-architecture
      - visual-preview
      - fix/victory-overlay-mobile
      - feature/progressive-hints-balance
      - feature/professional-home-ranks-story
      - fix/refresh-persistence-clean-main
      - feat/player-profile-dashboard

permissions:
  contents: write

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --no-save
      - name: Format player dashboard (one-time branch repair)
        if: github.ref_name == 'feat/player-profile-dashboard'
        run: |
          bunx prettier --write src/components/game/OnlineHub.tsx .github/workflows/validate-refactor.yml
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/game/OnlineHub.tsx .github/workflows/validate-refactor.yml
            git commit -m "style: apply Prettier formatting to player dashboard"
            git push origin "HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          fi
      - name: Run tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: Lint
        run: bun run lint
      - name: Verify formatting
        run: bunx prettier --check src/components/game/OnlineHub.tsx .github/workflows/validate-refactor.yml
