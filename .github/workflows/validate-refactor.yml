name: Validate NEON BREACH

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, refactor/solid-architecture, visual-preview, fix/victory-overlay-mobile, feature/progressive-hints-balance, feature/professional-home-ranks-story, fix/refresh-persistence-clean-main]

permissions:
  contents: write

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --no-save
      - name: Format source for validation
        if: github.ref == 'refs/heads/main'
        run: bun run format
      - name: Format preview branch
        if: github.ref == 'refs/heads/visual-preview' || github.ref == 'refs/heads/fix/victory-overlay-mobile' || github.ref == 'refs/heads/feature/progressive-hints-balance' || github.ref == 'refs/heads/feature/professional-home-ranks-story' || github.ref == 'refs/heads/fix/refresh-persistence-clean-main'
        run: bun run format
      - name: Run tests
        run: bun run test
      - name: Build
        run: bun run build
      - name: Lint
        run: bun run lint
